name: EOD Scanner (15:30 ET)
on:
  # 8 cron-слотов по UTC, каждые 15 минут. Без поля timezone (оно на этом
  # аккаунте не отрабатывает — проверено через API 02.09: scheduled-ран отсутствовал).
  # 19:00-20:45 UTC перекрывает окно 15:00-16:00 ET И в EDT (лето) и в EST (зима).
  # Остальные слоты для "не того" сезона гасятся Guard-шагом за ~20 секунд.
  # Каждый слот — отдельная очередь GitHub: даже при лагах планировщика
  # (на free-плане зафиксирован лаг 3ч47м) шанс, что один слот добежит вовремя, высокий.
  schedule:
    - cron: "0 19 * * 1-5"   # 15:00 EDT / 14:00 EST
    - cron: "15 19 * * 1-5"  # 15:15 EDT / 14:15 EST
    - cron: "30 19 * * 1-5"  # 15:30 EDT / 14:30 EST
    - cron: "45 19 * * 1-5"  # 15:45 EDT / 14:45 EST
    - cron: "0 20 * * 1-5"   # 16:00 EDT / 15:00 EST
    - cron: "15 20 * * 1-5"  # 16:15 EDT / 15:15 EST
    - cron: "30 20 * * 1-5"  # 16:30 EDT / 15:30 EST
    - cron: "45 20 * * 1-5"  # 16:45 EDT / 15:45 EST
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eod-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Guard (schedule only): ET window + dedup"
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          ET_HM=$(TZ="America/New_York" date +%H%M)
          echo "Schedule event at $(TZ='America/New_York' date +%H:%M) ET ($TODAY)"
          if [ "$ET_HM" -lt 1500 ] || [ "$ET_HM" -gt 1610 ]; then
            echo "Outside 15:00-16:10 ET window (other season) -> skipping in ~0s"
            exit 0
          fi
          if git log --oneline -30 | grep -q "scan $TODAY "; then
            echo "Scan for $TODAY already committed -> skipping (dedup)"
            exit 0
          fi
          echo "Window OK and no scan for $TODAY yet -> proceeding"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Month tag
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache market data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: nasdaq-data-${{ steps.month.outputs.month }}
          restore-keys: nasdaq-data-
      - name: Diagnostics
        run: |
          ls -lh data/ | head -30
          echo "Hist: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          free -h; df -h
      - name: Update universe
        run: python src/update_universe.py
      - name: Download history
        run: |
          echo "Incremental..."
          INCREMENTAL=1 python src/download_history.py || echo "incremental failed"
          echo "Hist after inc: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          if [ $(ls data/hist_*.csv 2>/dev/null | wc -l) -lt 50 ]; then
            echo "Full download..."
            python src/download_history.py
          fi
          echo "Final: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
      - name: Prep panel (robust v3 fixed)
        run: |
          python src/prep_panel.py
          ls -lh data/*.parquet
          python -c "import pandas as pd; df=pd.read_parquet('data/featured_panel.parquet'); print(f'{len(df)} rows, {df[\"ticker\"].nunique()} tickers')\"
      - name: Backtest if no OOS (or stale feature set)
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "src")
          from features import ALL_FEATURES
          vp = "data/oos_model_version.json"
          stale = True
          if os.path.exists(vp) and os.path.exists("data/oos_predictions.parquet"):
              try:
                  stale = json.load(open(vp)).get("n_features") != len(ALL_FEATURES)
              except Exception:
                  stale = True
          if stale:
              for f in ("data/oos_predictions.parquet",):
                  if os.path.exists(f):
                      os.remove(f)
              print("OOS missing or stale (feature set changed) -> will rebuild")
          PY
          if [ ! -f data/oos_predictions.parquet ]; then
            echo "No OOS cache, running backtest..."
            python src/backtest.py
          else
            echo "OOS cached $(du -h data/oos_predictions.parquet)"
          fi
      - name: Scan
        run: python src/scan.py
      - name: Build dashboard (full + simple TOP2 accordion)
        run: |
          python src/build_dashboard.py
          python src/build_simple_dashboard.py
          cp output/simple.html output/index.html
          echo "Dashboards: full=dashboard.html simple=index.html (TOP2 auto)"
          ls -lh output/
      - name: Check result
        run: |
          test -f output/scan_results.csv && echo "scan OK: $(wc -l < output/scan_results.csv)"
          test -f output/index.html && echo "dashboard OK: $(du -h output/index.html)"
          head -3 output/scan_results.csv
      - name: Enable Pages auto
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: 'true'
      - name: Commit push
        run: |
          git config user.name "eod-scanner-bot"
          git config user.email "eod-scanner-bot@users.noreply.github.com"
          git add output data/nasdaq_universe.csv data/fundamentals.json data/tier_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "scan $(date -u +%F) 15:30 ET"
            git push
          else
            echo "no changes"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
