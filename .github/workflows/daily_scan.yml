name: EOD Scanner (15:30 ET)
on:
  schedule:
    - cron: "30 19 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eod-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Month tag
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache market data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: data
          key: nasdaq-data-${{ steps.month.outputs.month }}
          restore-keys: nasdaq-data-
      - name: Diagnostics
        run: |
          ls -lh data/ | head -30
          echo "Hist: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          free -h; df -h
      - name: Update universe
        run: python src/update_universe.py
      - name: Download history
        run: |
          echo "Incremental..."
          INCREMENTAL=1 python src/download_history.py || echo "incremental failed"
          echo "Hist after inc: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          if [ $(ls data/hist_*.csv 2>/dev/null | wc -l) -lt 50 ]; then
            echo "Full download..."
            python src/download_history.py
          fi
          echo "Final: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
      - name: Prep panel (robust v3)
        run: |
          python src/prep_panel.py
          ls -lh data/*.parquet
          python -c "import pandas as pd; df=pd.read_parquet('data/featured_panel.parquet'); print(f'{len(df)} rows, {df[\"ticker\"].nunique()} tickers')"
      - name: Backtest if no OOS
        run: |
          if [ ! -f data/oos_predictions.parquet ]; then
            python src/backtest.py
          else
            echo "OOS cached $(du -h data/oos_predictions.parquet)"
          fi
      - name: Scan
        run: python src/scan.py
      - name: Build dashboard
        env:
          SCAN_TRIGGER_TOKEN: ${{ secrets.SCAN_TRIGGER_TOKEN }}
        run: python src/build_dashboard.py
      - name: Check result
        run: |
          test -f output/scan_results.csv && echo "scan OK: $(wc -l < output/scan_results.csv)"
          test -f output/index.html && echo "dashboard OK"
      - name: Enable Pages auto
        if: ${{ secrets.SCAN_TRIGGER_TOKEN != '' }}
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          token: ${{ secrets.SCAN_TRIGGER_TOKEN }}
          enablement: 'true'
      - name: Commit push
        run: |
          git config user.name "eod-scanner-bot"
          git config user.email "eod-scanner-bot@users.noreply.github.com"
          git add output data/nasdaq_universe.csv data/fundamentals.json
          if ! git diff --cached --quiet; then
            git commit -m "scan $(date -u +%F) 15:30 ET"
            git push
          else
            echo "no changes"
          fi
      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy Pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
