name: EOD Scanner (after close, entry next open)
on:
  # СКАН ПОСЛЕ ЗАКРЫТИЯ. Окно 16:10-17:10 ET = 23:10-00:10 TLV (летом 23:10-24:10).
  # EDT (лето, UTC-4): 16:10-17:10 ET = 20:10-21:10 UTC
  # EST (зима, UTC-5): 16:10-17:10 ET = 21:10-22:10 UTC
  # 8 слотов каждые 15 минут; guard гасит слоты "не того" сезона (выборка:
  # proceed=no -> все остальные шаги пропускаются, ран кончается за ~30 сек).
  # Каждый слот — отдельная очередь GitHub Actions: при лагах планировщика
  # (на free-плане фиксирован лаг до 3ч47м) шанс, что один слот дойдёт в
  # окно, гораздо выше, чем у одиночного cron.
  schedule:
    - cron: "15 20 * * 1-5"  # 16:15 EDT / 15:15 EST
    - cron: "30 20 * * 1-5"  # 16:30 EDT / 15:30 EST
    - cron: "45 20 * * 1-5"  # 16:45 EDT / 15:45 EST
    - cron: "0 21 * * 1-5"   # 17:00 EDT / 16:00 EST
    - cron: "15 21 * * 1-5"  # 17:15 EDT / 16:15 EST
    - cron: "30 21 * * 1-5"  # 17:30 EDT / 16:30 EST
    - cron: "45 21 * * 1-5"  # 17:45 EDT / 16:45 EST
    - cron: "0 22 * * 1-5"   # 18:00 EDT / 17:00 EST
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: eod-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: "Guard (schedule only): ET window 16:10-17:10 + same-day dedup"
        if: github.event_name == 'schedule'
        id: guard
        run: |
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          ET_HM=$(TZ="America/New_York" date +%H%M)
          ET_HM=${ET_HM:-0}
          echo "Schedule event at $(TZ='America/New_York' date +%H:%M) ET ($TODAY)"
          if [ "$ET_HM" -lt 1610 ] || [ "$ET_HM" -gt 1710 ]; then
            echo "Outside 16:10-17:10 ET window (other season) -> skip"
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          elif git log --oneline -30 | grep -q "scan $TODAY "; then
            echo "Scan for $TODAY already committed -> skip (dedup)"
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          else
            echo "Window OK and no scan for $TODAY -> proceed"
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        with:
          python-version: "3.12"
      - name: Cache pip
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: pip install -r requirements.txt
      - name: Month tag
        id: month
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache market data
        id: cache-data
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        uses: actions/cache@v4
        with:
          path: data
          key: nasdaq-data-${{ steps.month.outputs.month }}
          restore-keys: nasdaq-data-
      - name: Diagnostics
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          ls -lh data/ | head -30
          echo "Hist: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          free -h; df -h
      - name: Update universe
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: python src/update_universe.py
      - name: Download history
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          echo "Incremental..."
          INCREMENTAL=1 python src/download_history.py || echo "incremental failed"
          echo "Hist after inc: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
          if [ $(ls data/hist_*.csv 2>/dev/null | wc -l) -lt 50 ]; then
            echo "Full download..."
            python src/download_history.py
          fi
          echo "Final: $(ls data/hist_*.csv 2>/dev/null | wc -l)"
      - name: Prep panel (chunked, memory-safe, self-diagnosing)
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          if ! python src/prep_panel.py 2>&1 | tee /tmp/prep.log; then
            echo "========== PREP PANEL FAILED — DIAGNOSTICS =========="
            tail -50 /tmp/prep.log
            echo "---- python versions ----"
            python -c "import pandas, numpy, pyarrow, sklearn; print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| pyarrow', pyarrow.__version__, '| sklearn', sklearn.__version__)" 2>&1
            echo "---- memory ----"; free -h
            echo "---- disk ----"; df -h /home/runner /tmp
            echo "---- data ----"; echo "hist: $(ls data/hist_*.csv 2>/dev/null | wc -l)"; ls -lh data/ | head -15
            echo "========================================================="
            exit 1
          fi
          ls -lh data/featured_panel.parquet
          python -c "import pandas as pd; df=pd.read_parquet('data/featured_panel.parquet'); print(f'{len(df)} rows, {df[\"ticker\"].nunique()} tickers')\" || exit 1
      - name: Backtest if no OOS (or stale feature/label set)
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "src")
          from features import ALL_FEATURES
          vp = "data/oos_model_version.json"
          stale = True
          if os.path.exists(vp) and os.path.exists("data/oos_predictions.parquet"):
              try:
                  ver = json.load(open(vp))
                  stale = (ver.get("n_features") != len(ALL_FEATURES)
                           or ver.get("label_version") != "path_win_v1")
              except Exception:
                  stale = True
          if stale:
              for f in ("data/oos_predictions.parquet",):
                  if os.path.exists(f):
                      os.remove(f)
              print("OOS missing or stale (feature/label set changed) -> will rebuild")
          PY
          if [ ! -f data/oos_predictions.parquet ]; then
            echo "No OOS cache, running backtest..."
            python src/backtest.py
          else
            echo "OOS cached $(du -h data/oos_predictions.parquet)"
          fi
      - name: Scan
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: python src/scan.py
      - name: Build dashboard (full + simple TOP2 accordion)
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          python src/build_dashboard.py
          python src/build_simple_dashboard.py
          cp output/simple.html output/index.html
          echo "Dashboards: full=dashboard.html simple=index.html (TOP2 auto)"
          ls -lh output/
      - name: Check result
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          test -f output/scan_results.csv && echo "scan OK: $(wc -l < output/scan_results.csv)"
          test -f output/index.html && echo "dashboard OK: $(du -h output/index.html)"
          head -3 output/scan_results.csv
      - name: Enable Pages auto
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: 'true'
      - name: Commit push
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        run: |
          git config user.name "eod-scanner-bot"
          git config user.email "eod-scanner-bot@users.noreply.github.com"
          git add output data/nasdaq_universe.csv data/fundamentals.json data/tier_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "scan $(TZ='America/New_York' date +%F) after-close"
            git push
          else
            echo "no changes"
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy Pages
        if: github.event_name != 'schedule' || steps.guard.outputs.proceed == 'yes'
        uses: actions/deploy-pages@v4
