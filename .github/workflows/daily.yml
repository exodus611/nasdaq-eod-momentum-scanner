name: Dip-Buyer daily scan (after close)

# One run per trading day after the US close. No secrets needed: the job commits the journal + dashboard
# with the built-in GITHUB_TOKEN and publishes docs/ to GitHub Pages (Pages source = GitHub Actions).
# Cron is UTC and the US switches DST; slots before 16:15 ET are skipped by the gate step; the bot never processes the same day twice.
# A push to main also runs the job (smoke test + Pages redeploy); the bot's own commits do not re-trigger it.
on:
  schedule:
    # GitHub delays scheduled runs (yesterday: ~2 h). Each cron line is a separate queue, so we fire one every 15 min
    # across the window; the FIRST one to actually start after 16:15 ET does the scan, the rest exit in seconds.
    #   20:15-22:00 UTC = 16:15-18:00 EDT (summer) / 15:15-17:00 EST (winter; the <16:15 ET ones skip themselves)
    - cron: "17 20 * * 1-5"
    - cron: "32 20 * * 1-5"
    - cron: "47 20 * * 1-5"
    - cron: "2 21 * * 1-5"
    - cron: "17 21 * * 1-5"
    - cron: "32 21 * * 1-5"
    - cron: "47 21 * * 1-5"
    - cron: "2 22 * * 1-5"
    - cron: "32 22 * * 1-5"
    - cron: "2 23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "run | test | rebuild-page | refresh-universe"
        default: "run"
      asof:
        description: "optional YYYY-MM-DD — replay a past session (marked 'replay' in the journal)"
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dip-buyer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate (run only after the close and only if this session is not processed yet)
        id: gate
        run: |
          HM=$(TZ=America/New_York date +%H%M); echo "ET now: $HM"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$HM" -ge 1615 ]; then TARGET=$(TZ=America/New_York date +%F)
          elif [ "$HM" -lt 0900 ]; then TARGET=$(TZ=America/New_York date -d yesterday +%F)   # slot delayed past midnight ET
          else echo "go=no" >> "$GITHUB_OUTPUT"; echo "market not closed yet -> skip"; exit 0; fi
          if [ -f state/daily_log.csv ] && grep -q "^$TARGET," state/daily_log.csv; then
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "$TARGET already processed -> skip"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"; echo "processing $TARGET"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.go == 'yes'
        run: pip install -q -r requirements.txt

      - name: Refresh universe (Mondays)
        if: steps.gate.outputs.go == 'yes' && github.event_name == 'schedule'
        run: |
          if [ "$(TZ=America/New_York date +%u)" = "1" ]; then python bot.py refresh-universe || true; fi

      - name: Scan
        if: steps.gate.outputs.go == 'yes'
        env:
          CAPITAL: ${{ vars.CAPITAL || '100000' }}
          PER_NAME: ${{ vars.PER_NAME || '0.25' }}
          MAX_POS: ${{ vars.MAX_POS || '4' }}
          MAX_NEW: ${{ vars.MAX_NEW || '2' }}
          RSI_THR: ${{ vars.RSI_THR || '10' }}
          EXIT_SMA: ${{ vars.EXIT_SMA || '10' }}
          MAX_HOLD: ${{ vars.MAX_HOLD || '20' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PAGES_URL: ${{ vars.PAGES_URL || '' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'run' }}"
          ASOF="${{ github.event.inputs.asof }}"
          if [ -n "$ASOF" ]; then python bot.py "$MODE" --asof "$ASOF"; else python bot.py "$MODE"; fi

      - name: Commit journal + dashboard
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "dip-buyer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state docs README.md data/universe_nasdaq.csv || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "scan: $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          git pull --rebase || true
          git push

      - name: Configure Pages
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        if: steps.gate.outputs.go == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        if: steps.gate.outputs.go == 'yes'
        uses: actions/deploy-pages@v4
